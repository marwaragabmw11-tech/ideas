*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.7;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--radius);padding:6px 12px;cursor:pointer;min-height:40px;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{min-height:34px;padding:2px 10px;font-size:.9rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* capture: the one memorable element */
.capture{
  background:var(--surface);border:2px solid var(--ink);border-radius:14px;
  padding:14px;margin-bottom:22px;
  box-shadow:6px 6px 0 var(--sun);
}
.capture label{display:block;font-weight:600;margin-bottom:6px;font-size:1.05rem}
.capture textarea{
  width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);padding:10px 12px;line-height:1.7;
}
.capture .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.capture .help{color:var(--ink-soft);font-size:.9rem;margin:0}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px;padding-bottom:0;scrollbar-width:thin}
.tab{
  border:0;background:none;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--ink-soft);
  border-bottom:3px solid transparent;font-weight:500;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{display:inline-block;min-width:1.5em;margin-inline-start:4px;padding:0 6px;border-radius:99px;background:var(--line);font-size:.8rem}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 12px;min-height:40px}
.hint{color:var(--ink-soft);font-size:.92rem;margin:0 0 12px}
.limit{background:var(--sun-soft);border:1px solid var(--sun);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:.95rem}

.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.idea.open{border-color:var(--accent)}
.head{
  width:100%;display:flex;gap:12px;align-items:center;text-align:start;
  border:0;background:none;padding:12px 14px;cursor:pointer;
}
.head .txt{flex:1;min-width:0}
.head .t{font-weight:600;display:block;overflow-wrap:anywhere}
.head .m{display:block;color:var(--ink-soft);font-size:.88rem;overflow-wrap:anywhere}
.prio{
  flex:none;min-width:44px;text-align:center;border-radius:8px;padding:2px 8px;
  background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:.95rem;
}
.prio.hi{background:var(--sun);border-color:var(--sun);color:#16222c}
.body{padding:2px 14px 14px;border-top:1px dashed var(--line)}
.field{margin-top:12px}
.field>label,.field>.lab{display:block;font-weight:600;font-size:.95rem;margin-bottom:2px}
.field small{display:block;color:var(--ink-soft);margin-bottom:4px}
.field input[type=text],.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;
}
.field textarea{min-height:96px;resize:vertical}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.scores{grid-template-columns:1fr}}
.dots{display:flex;gap:6px}
.dot{
  width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;
}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;gap:8px;padding:3px 0}
.tasks input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.tasks .tx{flex:1;overflow-wrap:anywhere}
.tasks .done .tx{text-decoration:line-through;color:var(--ink-soft)}
.tasks .x{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;min-width:36px;min-height:36px}
.addtask{display:flex;gap:6px;margin-top:6px}
.addtask input{flex:1}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:end}
.foot .field{margin:0;flex:1;min-width:160px}
.empty{text-align:center;color:var(--ink-soft);padding:32px 12px;border:1px dashed var(--line);border-radius:var(--radius)}
.toast{
  position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:10px;
  padding:10px 14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.modes .btn{flex:1;min-width:140px}
.banner{background:var(--sun-soft);border:1px solid var(--sun);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;font-size:.95rem}
.interim{min-height:1.5em;margin:4px 0 0;color:var(--ink-soft);font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#16222c;font-weight:600}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.overlay[hidden]{display:none}
.ov-in{max-width:620px;margin:0 auto;padding:16px 16px 48px}
.ov-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.ov-top h2{margin:0;font-size:1.25rem}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--accent)}
.count{color:var(--ink-soft);font-size:.9rem;margin:0 0 16px}
.rv-card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:6px 6px 0 var(--sun)}
.rv-card h2{margin:0 0 8px;font-size:1.4rem;overflow-wrap:anywhere}
.rv-card p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-card .age{color:var(--ink-soft);font-size:.9rem}
.rv-card .lab{font-weight:600;margin:14px 0 2px}
.fc-step{font-size:1.25rem;font-weight:600}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.rv-actions .wide{grid-column:1/-1}
.rv-actions .btn{min-height:48px}
.timer{font-size:4.5rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:18px 0 4px;direction:ltr;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

    {k:'review', n:'للتقييم',    hint:'أعطِ كل فكرة درجة للأثر ودرجة للسهولة، وحدد أسهل خطوة تجرّبها خلال يوم. الأعلى أولوية يظهر في الأعلى.', empty:'لا أفكار قيد التقييم.'},
    {k:'active', n:'أعمل عليها', hint:'ثلاث أفكار كحد أقصى في الوقت نفسه. أنجز أو أجّل واحدة قبل أن تبدأ أخرى.', empty:'لا شيء نشط الآن. اختر فكرة من «للتقييم».'},
    {k:'done',   n:'منجزة',      hint:'ما أنجزته. راجعه حين تحتاج أن ترى تقدمك.', empty:'لا أفكار منجزة بعد.'},
    {k:'parked', n:'مؤجلة',      hint:'أفكار جيدة ليس وقتها الآن. لا تحذفها، فقط ارجع إليها لاحقاً.', empty:'لا أفكار مؤجلة.'}
  ];

  var state = { ideas: [], tab: 'inbox', open: null, q: '', lastReview: 0, ignored: [] };
  var BASE_TITLE = document.title;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var d = JSON.parse(raw); if(Array.isArray(d.ideas)) state.ideas = d.ideas; state.lastReview = d.lastReview || 0; state.ignored = Array.isArray(d.ignored) ? d.ignored : []; }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({ideas: state.ideas, lastReview: state.lastReview, ignored: state.ignored})); }
    catch(e){ toast('تعذّر الحفظ في المتصفح. صدّر نسخة احتياطية.'); }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function find(id){ for(var i=0;i<state.ideas.length;i++){ if(state.ideas[i].id===id) return state.ideas[i]; } return null; }
  function prio(i){ return (i.impact||0) * (i.ease||0); }
  function countBy(k){ return state.ideas.filter(function(i){ return i.status===k; }).length; }

  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* ---------- capture ---------- */
  function addFromDump(){
    stopMic();
    var ta = document.getElementById('dump');
    var lines = ta.value.split(/\n+/).map(function(l){ return l.replace(/^[\s\-\*•\d\.\)]+/, '').trim(); }).filter(Boolean);
    if(!lines.length){ toast('اكتب فكرة واحدة على الأقل.'); ta.focus(); return; }
    lines.forEach(function(t){
      state.ideas.unshift({id:uid(), title:t, notes:'', step:'', tag:'', impact:0, ease:0, status:'inbox', tasks:[], created:Date.now()});
    });
    ta.value = '';
    state.tab = 'inbox'; state.q = ''; document.getElementById('search').value = '';
    save(); render();
    toast(lines.length === 1 ? 'أُضيفت فكرة إلى المخزن.' : 'أُضيفت ' + lines.length + ' أفكار إلى المخزن.');
    ta.focus();
  }

  /* ---------- render ---------- */
  function renderTabs(){
    var html = STATUSES.map(function(s){
      return '<button class="tab" role="tab" data-tab="' + s.k + '" aria-selected="' + (state.tab===s.k) + '">' + s.n + '<span class="n">' + countBy(s.k) + '</span></button>';
    }).join('');
    document.getElementById('tabs').innerHTML = html;
  }

  function dots(field, val){
    var h = '';
    for(var n=1;n<=5;n++){
      h += '<button type="button" class="dot" data-act="score" data-field="' + field + '" data-v="' + n + '" aria-pressed="' + (val===n) + '">' + n + '</button>';
    }
    return '<div class="dots">' + h + '</div>';
  }

  function cardHtml(i){
    var open = state.open === i.id;
    var p = prio(i);
    var done = i.tasks.filter(function(t){ return t.done; }).length;
    var meta = [];
    if(i.tag) meta.push(esc(i.tag));
    if(i.tasks.length) meta.push('الخطوات ' + done + '/' + i.tasks.length);
    if(i.step) meta.push('الخطوة التالية: ' + esc(i.step));
    var h = '<article class="idea' + (open ? ' open' : '') + '" data-id="' + i.id + '">';
    h += '<button type="button" class="head" data-act="toggle" aria-expanded="' + open + '">';
    h += '<span class="txt"><span class="t">' + esc(i.title) + '</span>' + (meta.length ? '<span class="m">' + meta.join(' | ') + '</span>' : '') + '</span>';
    if(p) h += '<span class="prio' + (p >= 15 ? ' hi' : '') + '" title="الأولوية = الأثر × السهولة">' + p + '</span>';
    h += '</button>';
    if(open){
      h += '<div class="body">';
      h += '<div class="field"><label for="f-title">الفكرة</label><input type="text" id="f-title" data-field="title" value="' + esc(i.title) + '"></div>';
      h += '<div class="field"><label for="f-notes">ملاحظات</label><textarea id="f-notes" data-field="notes" placeholder="لماذا هي مهمة؟ ما المشكلة التي تحلها؟ ما الذي يقلقك فيها؟">' + esc(i.notes) + '</textarea></div>';
      h += '<div class="scores">';
      h += '<div class="field"><span class="lab">الأثر</span><small>كم ستغيّر إن نجحت؟</small>' + dots('impact', i.impact) + '</div>';
      h += '<div class="field"><span class="lab">السهولة</span><small>كم هي سهلة البدء؟</small>' + dots('ease', i.ease) + '</div>';
      h += '</div>';
      h += '<div class="field"><label for="f-step">أسهل خطوة أجرّبها خلال يوم</label><input type="text" id="f-step" data-field="step" value="' + esc(i.step) + '" placeholder="مثال: أكلّم شخصاً واحداً عنها"></div>';
      h += '<div class="field"><span class="lab">خطوات العمل</span><ul class="tasks">';
      i.tasks.forEach(function(t, idx){
        h += '<li class="' + (t.done ? 'done' : '') + '"><input type="checkbox" data-act="tick" data-idx="' + idx + '"' + (t.done ? ' checked' : '') + ' aria-label="تم"><span class="tx">' + esc(t.t) + '</span><button type="button" class="x" data-act="deltask" data-idx="' + idx + '" aria-label="حذف الخطوة">×</button></li>';
      });
      h += '</ul><div class="addtask"><input type="text" id="f-task" placeholder="أضف خطوة" aria-label="خطوة جديدة"><button type="button" class="btn small" data-act="addtask">إضافة</button></div></div>';
      h += '<div class="foot">';
      h += '<div class="field"><label for="f-tag">وسم</label><input type="text" id="f-tag" data-field="tag" value="' + esc(i.tag) + '" placeholder="عمل، مشروع، شخصي..."></div>';
      h += '<div class="field"><label for="f-status">المرحلة</label><select id="f-status" data-field="status">';
      STATUSES.forEach(function(s){ h += '<option value="' + s.k + '"' + (i.status===s.k ? ' selected' : '') + '>' + s.n + '</option>'; });
      h += '</select></div>';
      h += '<button type="button" class="btn small" data-act="focus">ركّز عليها</button>';
      h += '<button type="button" class="btn small danger" data-act="delete">حذف الفكرة</button>';
      h += '</div></div>';
    }
    h += '</article>';
    return h;
  }

  function render(){
    renderTabs(); renderBanner();
    var cur = STATUSES.filter(function(s){ return s.k === state.tab; })[0];
    document.getElementById('hint').textContent = cur.hint;

    var limitEl = document.getElementById('limit');
    if(state.tab === 'active'){
      var n = countBy('active');
      limitEl.innerHTML = '<div class="limit">' + (n >= MAX_ACTIVE ? 'وصلت إلى الحد: ' : 'النشطة الآن: ') + n + ' من ' + MAX_ACTIVE + '.</div>';
    } else limitEl.innerHTML = '';

    var q = state.q.trim().toLowerCase();
    var items = state.ideas.filter(function(i){
      if(i.status !== state.tab) return false;
      if(!q) return true;
      return (i.title + ' ' + i.notes + ' ' + i.tag + ' ' + i.step).toLowerCase().indexOf(q) !== -1;
    });
    if(state.tab === 'review' || state.tab === 'active'){
      items.sort(function(a,b){ return prio(b) - prio(a) || b.created - a.created; });
    }
    var list = document.getElementById('list');
    list.innerHTML = items.length ? items.map(cardHtml).join('') : '<div class="empty">' + (q ? 'لا نتائج لهذا البحث.' : cur.empty) + '</div>';
  }

  /* ---------- events ---------- */
  document.getElementById('addBtn').addEventListener('click', addFromDump);
  document.getElementById('dump').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addFromDump(); }
  });
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    state.tab = b.getAttribute('data-tab'); state.open = null; render();
  });
  document.getElementById('search').addEventListener('input', function(e){ state.q = e.target.value; render(); });

  var list = document.getElementById('list');
  list.addEventListener('click', function(e){
    var card = e.target.closest('.idea'); if(!card) return;
    var idea = find(card.getAttribute('data-id')); if(!idea) return;
    var btn = e.target.closest('[data-act]'); if(!btn) return;
    var act = btn.getAttribute('data-act');
    if(act === 'toggle'){ state.open = (state.open === idea.id) ? null : idea.id; render(); return; }
    if(act === 'score'){
      var f = btn.getAttribute('data-field'), v = +btn.getAttribute('data-v');
      idea[f] = (idea[f] === v) ? 0 : v; save(); render(); return;
    }
    if(act === 'tick'){ idea.tasks[+btn.getAttribute('data-idx')].done = btn.checked; save(); render(); return; }
    if(act === 'deltask'){ idea.tasks.splice(+btn.getAttribute('data-idx'), 1); save(); render(); return; }
    if(act === 'addtask'){ addTask(idea, card); return; }
    if(act === 'focus'){ startFocus(idea.id); return; }
    if(act === 'delete'){
      if(confirm('حذف هذه الفكرة نهائياً؟')){
        state.ideas = state.ideas.filter(function(x){ return x.id !== idea.id; });
        state.open = null; save(); render(); toast('حُذفت الفكرة.');
      }
    }
  });
  function addTask(idea, card){
    var inp = card.querySelector('#f-task');
    var v = inp.value.trim(); if(!v) { inp.focus(); return; }
    idea.tasks.push({t:v, done:false}); save(); render();
    var again = document.querySelector('.idea.open #f-task'); if(again) again.focus();
  }
  list.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'f-task'){
      e.preventDefault();
      var card = e.target.closest('.idea');
      addTask(find(card.getAttribute('data-id')), card);
    }
  });
  list.addEventListener('input', function(e){
    var f = e.target.getAttribute('data-field');
    if(!f || f === 'status') return;
    var card = e.target.closest('.idea'); var idea = find(card.getAttribute('data-id'));
    idea[f] = e.target.value; save();
  });
  list.addEventListener('change', function(e){
    var f = e.target.getAttribute('data-field');
    if(f === 'title' || f === 'tag' || f === 'step'){ render(); return; }
    if(f !== 'status') return;
    var card = e.target.closest('.idea'); var idea = find(card.getAttribute('data-id'));
    var to = e.target.value;
    if(to === 'active' && idea.status !== 'active' && countBy('active') >= MAX_ACTIVE){
      toast('عندك ' + MAX_ACTIVE + ' أفكار نشطة. أنجز أو أجّل واحدة أولاً.');
      e.target.value = idea.status; return;
    }
    idea.status = to; state.tab = to; save(); render();
    toast('نُقلت الفكرة إلى «' + STATUSES.filter(function(s){ return s.k===to; })[0].n + '».');
  });

  /* ---------- backup / export ---------- */
  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify({ideas: state.ideas}, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ideas-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0]; if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.ideas)) throw new Error('bad');
        var ids = {}; state.ideas.forEach(function(i){ ids[i.id] = 1; });
        var added = 0;
        d.ideas.forEach(function(i){
          if(i && i.title && !ids[i.id]){
            i.tasks = Array.isArray(i.tasks) ? i.tasks : [];
            i.status = i.status || 'inbox';
            i.id = i.id || uid();
            state.ideas.push(i); added++;
          }
        });
        save(); render(); toast('تم استيراد ' + added + ' فكرة.');
      }catch(err){ toast('الملف غير صالح. اختر ملفاً صدّرته من هذه الصفحة.'); }
      e.target.value = '';
    };
    r.readAsText(file);
  });
  document.getElementById('copyBtn').addEventListener('click', function(){
    var out = STATUSES.map(function(s){
      var items = state.ideas.filter(function(i){ return i.status === s.k; });
      if(!items.length) return '';
      return '## ' + s.n + '\n' + items.map(function(i){
        var line = '- ' + i.title + (prio(i) ? ' (الأولوية ' + prio(i) + ')' : '');
        if(i.step) line += '\n  الخطوة التالية: ' + i.step;
        i.tasks.forEach(function(t){ line += '\n  [' + (t.done ? 'x' : ' ') + '] ' + t.t; });
        return line;
      }).join('\n');
    }).filter(Boolean).join('\n\n');
    if(!out){ toast('لا توجد أفكار لنسخها.'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out).then(function(){ toast('نُسخت الأفكار كنص.'); }, function(){ toast('تعذّر النسخ.'); });
    } else toast('تعذّر النسخ في هذا المتصفح.');
  });

  /* ---------- theme ---------- */
  document.getElementById('themeBtn').addEventListener('click', function(){
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('idea-vault-theme', next); }catch(e){}
  });
  try{
    var th = localStorage.getItem('idea-vault-theme');
    if(th) document.documentElement.setAttribute('data-theme', th);
  }catch(e){}

  /* ---------- overlay (review + focus) ---------- */
  var ov = document.getElementById('overlay');
  var ovMode = null, lastEl = null;
  function openOv(html, mode){
    if(ov.hidden){ lastEl = document.activeElement; }
    ovMode = mode;
    ov.innerHTML = '<div class="ov-in" role="dialog" aria-modal="true" aria-label="' + (mode === 'focus' ? 'وضع التركيز' : (mode === 'dedupe' ? 'دمج المتشابه' : 'المراجعة الأسبوعية')) + '">' + html + '</div>';
    ov.hidden = false; document.body.style.overflow = 'hidden';
    var f = ov.querySelector('[data-autofocus]') || ov.querySelector('[data-ov="close"]');
    if(f) f.focus();
  }
  function closeOv(){
    stopTimer(); ov.hidden = true; ov.innerHTML = ''; ovMode = null;
    document.body.style.overflow = '';
    if(lastEl && lastEl.focus) lastEl.focus();
    render();
  }
  ov.addEventListener('click', function(e){
    var b = e.target.closest('[data-ov]'); if(!b) return;
    var a = b.getAttribute('data-ov');
    if(a === 'close'){ closeOv(); return; }
    if(ovMode === 'review' && a.indexOf('r-') === 0){ reviewAct(a.slice(2)); return; }
    if(ovMode === 'dedupe' && a.indexOf('d-') === 0){ dedupeAct(a.slice(2), b); return; }
    if(ovMode === 'focus'){ focusAct(a); }
  });
  ov.addEventListener('change', function(e){
    if(e.target.id === 'fc-pick'){ fc.id = e.target.value; stopTimer(); fc.left = fc.total; renderFocus(); }
    if(e.target.id === 'fc-dur'){ fc.total = (+e.target.value) * 60; stopTimer(); fc.left = fc.total; renderFocus(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !ov.hidden) closeOv(); });

  /* ---------- weekly review ---------- */
  var rv = {queue: [], i: 0, c: null};
  function startReview(){
    var q = state.ideas.filter(function(i){ return i.status === 'inbox'; })
      .sort(function(a,b){ return a.created - b.created; })
      .map(function(i){ return i.id; });
    if(!q.length){ toast('المخزن فارغ. لا شيء للمراجعة.'); return; }
    rv.queue = q; rv.i = 0; rv.c = {review:0, active:0, parked:0, deleted:0, skipped:0};
    renderReview();
  }
  function ageText(ts){
    var d = Math.floor((Date.now() - ts) / 86400000);
    if(d < 1) return 'أُضيفت اليوم';
    if(d === 1) return 'أُضيفت أمس';
    return 'أُضيفت منذ ' + d + (d <= 10 ? ' أيام' : ' يوماً');
  }
  function renderReview(){
    var total = rv.queue.length;
    while(rv.i < total && !find(rv.queue[rv.i])) rv.i++;
    if(rv.i >= total){
      state.lastReview = Date.now(); save();
      var c = rv.c;
      openOv('<div class="ov-top"><h2>انتهت المراجعة</h2><button type="button" class="btn" data-ov="close" data-autofocus>إغلاق</button></div>' +
        '<div class="rv-card"><h2>راجعت ' + total + ' فكرة</h2>' +
        '<p>إلى التقييم: ' + c.review + '</p><p>إلى العمل: ' + c.active + '</p><p>مؤجلة: ' + c.parked + '</p><p>محذوفة: ' + c.deleted + '</p><p>تخطّيتها: ' + c.skipped + '</p></div>', 'review');
      return;
    }
    var idea = find(rv.queue[rv.i]);
    var pct = Math.round(rv.i / total * 100);
    var h = '<div class="ov-top"><h2>المراجعة الأسبوعية</h2><button type="button" class="btn" data-ov="close">إغلاق</button></div>';
    h += '<div class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div>';
    h += '<p class="count">الفكرة ' + (rv.i + 1) + ' من ' + total + '</p>';
    h += '<div class="rv-card"><h2>' + esc(idea.title) + '</h2><p class="age">' + ageText(idea.created) + '</p>';
    if(idea.notes) h += '<p>' + esc(idea.notes) + '</p>';
    h += '<div class="rv-actions">';
    h += '<button type="button" class="btn primary" data-ov="r-active" data-autofocus>أعمل عليها الآن</button>';
    h += '<button type="button" class="btn" data-ov="r-review">أقيّمها لاحقاً</button>';
    h += '<button type="button" class="btn" data-ov="r-parked">أجّلها</button>';
    h += '<button type="button" class="btn" data-ov="r-skip">تخطَّ</button>';
    h += '<button type="button" class="btn danger wide" data-ov="r-delete">احذفها</button>';
    h += '</div></div>';
    openOv(h, 'review');
  }
  function reviewAct(a){
    var idea = find(rv.queue[rv.i]);
    if(!idea){ rv.i++; renderReview(); return; }
    if(a === 'active' && countBy('active') >= MAX_ACTIVE){
      toast('عندك ' + MAX_ACTIVE + ' أفكار نشطة. أنجز أو أجّل واحدة أولاً.'); return;
    }
    if(a === 'delete'){
      if(!confirm('حذف هذه الفكرة نهائياً؟')) return;
      state.ideas = state.ideas.filter(function(x){ return x.id !== idea.id; }); rv.c.deleted++;
    } else if(a === 'skip'){ rv.c.skipped++; }
    else { idea.status = a; rv.c[a]++; }
    save(); rv.i++; renderReview();
  }
  function renderBanner(){
    var el = document.getElementById('banner');
    var inbox = state.ideas.filter(function(i){ return i.status === 'inbox'; });
    if(!inbox.length){ el.innerHTML = ''; return; }
    var DAY = 86400000, now = Date.now();
    var oldest = Math.min.apply(null, inbox.map(function(i){ return i.created; }));
    var since = state.lastReview ? Math.floor((now - state.lastReview) / DAY) : null;
    var due = since === null ? (now - oldest) >= 7 * DAY : since >= 7;
    if(!due){ el.innerHTML = ''; return; }
    var msg = since === null ? 'في المخزن ' + inbox.length + ' فكرة تنتظر مراجعتك.' : 'مرّ ' + since + (since <= 10 ? ' أيام' : ' يوماً') + ' على آخر مراجعة، وفي المخزن ' + inbox.length + ' فكرة.';
    el.innerHTML = '<div class="banner"><p>' + msg + '</p><button type="button" class="btn small primary" data-banner="review">ابدأ المراجعة</button></div>';
  }
  document.getElementById('banner').addEventListener('click', function(e){
    if(e.target.closest('[data-banner]')) startReview();
  });
  document.getElementById('reviewBtn').addEventListener('click', startReview);

  /* ---------- focus mode ---------- */
  var fc = {id: null, total: 1500, left: 1500, endAt: 0, timer: null, running: false};
  function fmt(s){ var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function nextStep(idea){
    var t = idea.tasks.filter(function(x){ return !x.done; })[0];
    if(t) return {text: t.t, kind: 'task', ref: t};
    if(idea.step) return {text: idea.step, kind: 'step'};
    return null;
  }
  function tick(){
    fc.left = Math.max(0, Math.round((fc.endAt - Date.now()) / 1000));
    var el = document.getElementById('fc-time'); if(el) el.textContent = fmt(fc.left);
    document.title = fmt(fc.left) + ' | ' + BASE_TITLE;
    if(fc.left <= 0){
      stopTimer(); toast('انتهى الوقت. خذ استراحة قصيرة.');
      try{ if(navigator.vibrate) navigator.vibrate([300, 150, 300]); }catch(e){}
      if(ovMode === 'focus') renderFocus();
    }
  }
  function startTimer(){
    if(fc.left <= 0) fc.left = fc.total;
    fc.endAt = Date.now() + fc.left * 1000; fc.running = true;
    clearInterval(fc.timer); fc.timer = setInterval(tick, 500);
  }
  function stopTimer(){
    clearInterval(fc.timer); fc.timer = null; fc.running = false; document.title = BASE_TITLE;
  }
  function startFocus(id){
    if(!id){
      var act = state.ideas.filter(function(i){ return i.status === 'active'; }).sort(function(a,b){ return prio(b) - prio(a); });
      if(!act.length){ toast('لا توجد فكرة نشطة. انقل فكرة إلى «أعمل عليها» أولاً.'); return; }
      id = act[0].id;
    }
    stopTimer(); fc.id = id; fc.left = fc.total; renderFocus();
  }
  function renderFocus(){
    var idea = find(fc.id); if(!idea){ closeOv(); return; }
    var step = nextStep(idea);
    var opts = state.ideas.filter(function(i){ return i.status === 'active' || i.id === idea.id; });
    var h = '<div class="ov-top"><h2>وضع التركيز</h2><button type="button" class="btn" data-ov="close">خروج</button></div>';
    if(opts.length > 1){
      h += '<div class="field"><label for="fc-pick">الفكرة</label><select id="fc-pick">';
      opts.forEach(function(i){ h += '<option value="' + i.id + '"' + (i.id === idea.id ? ' selected' : '') + '>' + esc(i.title) + '</option>'; });
      h += '</select></div>';
    }
    h += '<div class="rv-card" style="margin-top:14px"><h2>' + esc(idea.title) + '</h2><p class="lab">الخطوة الآن</p>';
    h += '<p class="fc-step">' + (step ? esc(step.text) : 'لا توجد خطوة محددة. أضف واحدة من بطاقة الفكرة.') + '</p></div>';
    h += '<div class="timer" id="fc-time" role="timer">' + fmt(fc.left) + '</div>';
    var label = fc.running ? 'إيقاف مؤقت' : (fc.left <= 0 ? 'ابدأ من جديد' : (fc.left < fc.total ? 'متابعة' : 'ابدأ'));
    h += '<div class="rv-actions"><button type="button" class="btn primary" data-ov="toggle" data-autofocus>' + label + '</button>';
    h += '<button type="button" class="btn" data-ov="reset">إعادة</button>';
    if(step) h += '<button type="button" class="btn wide" data-ov="stepdone">أنجزت هذه الخطوة</button>';
    h += '<button type="button" class="btn wide" data-ov="ideadone">أنجزت الفكرة كلها</button></div>';
    h += '<div class="field"><label for="fc-dur">المدة</label><select id="fc-dur">';
    [15, 25, 45].forEach(function(m){ h += '<option value="' + m + '"' + (fc.total === m * 60 ? ' selected' : '') + '>' + m + ' دقيقة</option>'; });
    h += '</select></div>';
    openOv(h, 'focus');
  }
  function focusAct(a){
    var idea = find(fc.id); if(!idea) return;
    if(a === 'toggle'){
      if(fc.running){ fc.left = Math.max(0, Math.round((fc.endAt - Date.now()) / 1000)); stopTimer(); }
      else startTimer();
      renderFocus();
    } else if(a === 'reset'){
      stopTimer(); fc.left = fc.total; renderFocus();
    } else if(a === 'stepdone'){
      var s = nextStep(idea); if(!s) return;
      if(s.kind === 'task') s.ref.done = true; else idea.step = '';
      save(); toast('أحسنت. أنجزت خطوة.'); renderFocus();
    } else if(a === 'ideadone'){
      idea.status = 'done'; state.tab = 'done'; state.open = null; save();
      toast('أُنجزت الفكرة. أحسنت!'); closeOv();
    }
  }
  document.getElementById('focusBtn').addEventListener('click', function(){ startFocus(null); });

  /* ---------- voice input ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById('micBtn'), interimEl = document.getElementById('interim');
  var rec = null, listening = false;
  function micUi(){
    micBtn.setAttribute('aria-pressed', listening);
    micBtn.textContent = listening ? 'إيقاف التسجيل' : 'تحدّث';
    document.getElementById('micHelp').textContent = listening ? 'يتم التسجيل. توقّف قليلاً بين كل فكرة وأخرى.' : 'Ctrl + Enter للإضافة السريعة';
    if(!listening) interimEl.textContent = '';
  }
  function stopMic(){
    listening = false;
    try{ if(rec) rec.stop(); }catch(e){}
    micUi();
  }
  function startMic(){
    rec = new SR(); rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e){
      var interim = '', ta = document.getElementById('dump');
      for(var i = e.resultIndex; i < e.results.length; i++){
        var r = e.results[i];
        if(r.isFinal){
          var t = r[0].transcript.trim();
          if(t){ ta.value += (ta.value && !/\n$/.test(ta.value) ? '\n' : '') + t + '\n'; }
        } else interim += r[0].transcript;
      }
      interimEl.textContent = interim;
    };
    rec.onerror = function(e){
      if(e.error === 'no-speech') return;
      toast(e.error === 'not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون.' : 'تعذّر التعرف على الصوت.');
      stopMic();
    };
    rec.onend = function(){
      if(listening){ try{ rec.start(); }catch(e){ stopMic(); } } else micUi();
    };
    listening = true; micUi();
    try{ rec.start(); }catch(e){ stopMic(); }
  }
  if(!SR){ micBtn.hidden = true; }
  else micBtn.addEventListener('click', function(){ if(listening) stopMic(); else startMic(); });

  /* ---------- merge similar ideas ---------- */
  var STOP = {'في':1,'من':1,'على':1,'الى':1,'عن':1,'مع':1,'هذا':1,'هذه':1,'ان':1,'او':1,'ثم':1,'كل':1,'ما':1,'هل':1,'اي':1,'عند':1};
  function tokens(t){
    var n = String(t).toLowerCase()
      .replace(/[\u064B-\u0652\u0640]/g, '')
      .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[^\u0621-\u063A\u0641-\u064Aa-z0-9 ]/g, ' ');
    var out = {}, list = [];
    n.split(/\s+/).forEach(function(w){
      if(w.length > 3 && w.indexOf('ال') === 0) w = w.slice(2);
      if(w.length < 2 || STOP[w] || out[w]) return;
      out[w] = 1; list.push(w);
    });
    return list;
  }
  function similarity(a, b){
    if(!a.length || !b.length) return 0;
    var set = {}; a.forEach(function(w){ set[w] = 1; });
    var inter = 0; b.forEach(function(w){ if(set[w]) inter++; });
    if(!inter) return 0;
    var union = a.length + b.length - inter;
    var jac = inter / union;
    var minLen = Math.min(a.length, b.length);
    var cont = minLen >= 2 ? (inter / minLen) * 0.9 : 0;
    return Math.max(jac, cont);
  }
  function pairKey(a, b){ return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; }
  var dd = {skip: {}, merged: 0, ignored: 0};
  function findPairs(){
    var pool = state.ideas.filter(function(i){ return i.status !== 'done'; });
    var tk = pool.map(function(i){ return tokens(i.title); });
    var out = [];
    for(var x = 0; x < pool.length; x++){
      for(var y = x + 1; y < pool.length; y++){
        var key = pairKey(pool[x], pool[y]);
        if(state.ignored.indexOf(key) !== -1 || dd.skip[key]) continue;
        var sc = similarity(tk[x], tk[y]);
        if(sc >= 0.55) out.push({a: pool[x], b: pool[y], score: sc, key: key});
      }
    }
    out.sort(function(p, q){ return q.score - p.score; });
    return out;
  }
  function startDedupe(){
    dd.skip = {}; dd.merged = 0; dd.ignored = 0;
    if(state.ideas.filter(function(i){ return i.status !== 'done'; }).length < 2){ toast('تحتاج فكرتين على الأقل.'); return; }
    renderDedupe();
  }
  function statusName(k){ return STATUSES.filter(function(s){ return s.k === k; })[0].n; }
  function sideHtml(i, which){
    var h = '<div class="rv-card" style="margin-bottom:12px"><p class="age">' + statusName(i.status) + (i.tasks.length ? ' | ' + i.tasks.length + ' خطوات' : '') + '</p><h2>' + esc(i.title) + '</h2>';
    if(i.notes) h += '<p>' + esc(i.notes) + '</p>';
    h += '<button type="button" class="btn primary" style="width:100%;margin-top:8px" data-ov="d-keep" data-which="' + which + '">ادمج واحتفظ بهذا العنوان</button></div>';
    return h;
  }
  var ddCur = null;
  function renderDedupe(){
    var pairs = findPairs();
    var top = '<div class="ov-top"><h2>دمج المتشابه</h2><button type="button" class="btn" data-ov="close"' + (pairs.length ? '' : ' data-autofocus') + '>إغلاق</button></div>';
    if(!pairs.length){
      ddCur = null;
      var msg = (dd.merged || dd.ignored) ? 'دمجت ' + dd.merged + ' وتركت ' + dd.ignored + ' كما هي.' : 'لم أجد أفكاراً متشابهة في العناوين.';
      openOv(top + '<div class="rv-card"><h2>انتهينا</h2><p>' + msg + '</p><p class="age">المقارنة تعتمد على الكلمات المشتركة في العناوين، فقد تفوتها أفكار متقاربة بكلمات مختلفة.</p></div>', 'dedupe');
      return;
    }
    var pr = pairs[0]; ddCur = pr;
    var h = top + '<p class="count">أفكار متشابهة متبقية: ' + pairs.length + '</p>';
    h += sideHtml(pr.a, 'a') + sideHtml(pr.b, 'b');
    h += '<div class="rv-actions"><button type="button" class="btn" data-ov="d-different" data-autofocus>ليستا متشابهتين</button><button type="button" class="btn" data-ov="d-skip">لاحقاً</button></div>';
    openOv(h, 'dedupe');
  }
  var ORDER = {active: 3, review: 2, inbox: 1, parked: 0};
  function mergeInto(keep, drop){
    if(drop.notes && drop.notes !== keep.notes) keep.notes = keep.notes ? keep.notes + '\n---\n' + drop.notes : drop.notes;
    var have = {}; keep.tasks.forEach(function(t){ have[t.t] = 1; });
    drop.tasks.forEach(function(t){ if(!have[t.t]) keep.tasks.push(t); });
    if(!keep.step) keep.step = drop.step;
    if(!keep.tag) keep.tag = drop.tag;
    keep.impact = Math.max(keep.impact || 0, drop.impact || 0);
    keep.ease = Math.max(keep.ease || 0, drop.ease || 0);
    keep.created = Math.min(keep.created, drop.created);
    if((ORDER[drop.status] || 0) > (ORDER[keep.status] || 0)) keep.status = drop.status;
    state.ideas = state.ideas.filter(function(x){ return x.id !== drop.id; });
    state.ignored = state.ignored.filter(function(k){ return k.indexOf(drop.id) === -1; });
  }
  function dedupeAct(a, btn){
    if(!ddCur) return;
    if(a === 'keep'){
      var which = btn.getAttribute('data-which');
      mergeInto(which === 'a' ? ddCur.a : ddCur.b, which === 'a' ? ddCur.b : ddCur.a);
      dd.merged++; save(); toast('تم الدمج.');
    } else if(a === 'different'){
      state.ignored.push(ddCur.key); dd.ignored++; save();
    } else if(a === 'skip'){
      dd.skip[ddCur.key] = 1;
    }
    renderDedupe();
  }
  document.getElementById('dedupeBtn').addEventListener('click', startDedupe);


  /* ---------- offline ---------- */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  load(); render();
})();
</script>
</body>
